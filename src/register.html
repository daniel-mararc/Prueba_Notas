<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles/styles_register.css" />
    <title>Registro</title>
  </head>
  <body>
    <div class="card">
      <h1>Crear cuenta</h1>

      <label for="email">Correo electrónico</label>
      <input
        type="email"
        id="email"
        placeholder="tu@correo.com"
        autocomplete="email"
      />
      <p class="err-msg" id="errorEmail">Ingresa un correo válido.</p>

      <label for="password">Contraseña</label>
      <input
        type="password"
        id="password"
        placeholder="••••••••"
        autocomplete="new-password"
      />
      <p class="err-msg" id="errorPassword">Mínimo 6 caracteres.</p>

      <label for="password2">Repite la contraseña</label>
      <input
        type="password"
        id="password2"
        placeholder="••••••••"
        autocomplete="new-password"
      />
      <p class="err-msg" id="errorPassword2">Las contraseñas no coinciden.</p>

      <div class="botones">
        <button id="botonRegistrar">Registrarse</button>
      </div>

      <p class="footer">
        ¿Ya tienes cuenta? <a href="./index.html">Inicia sesión</a>
      </p>
    </div>
  </body>
  <script src="register.js"></script>
</html>
