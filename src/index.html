<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles/styles_login.css" />
    <title>Iniciar Sesión</title>
  </head>
  <body>
    <div class="card">
      <h1>Iniciar sesión</h1>

      <label for="email">Correo electrónico</label>
      <input
        type="email"
        id="email"
        placeholder="tu@correo.com"
        autocomplete="email"
      />
      <p class="err-msg" id="errorEmail">Ingresa un correo válido.</p>

      <div class="fila">
        <label for="password">Contraseña</label>
        <!-- <a href="#">¿Olvidaste tu contraseña?</a> -->
      </div>
      <input
        type="password"
        id="password"
        placeholder="••••••••"
        autocomplete="current-password"
      />
      <p class="err-msg" id="errorPassword">Mínimo 6 caracteres.</p>

      <div class="botones">
        <button id="botonEntrar">Entrar</button>
      </div>

      <p class="footer">
        ¿No tienes cuenta? <a href="./register.html">Regístrate</a>
      </p>
    </div>
  </body>
  <script src="login.js"></script>
</html>
