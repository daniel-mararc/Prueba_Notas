<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar Sesión</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma, sans-serif;
      }

      body {
        background-color: #f5f0e8;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .card {
        background-color: #ffffff;
        border-radius: 20px;
        padding: 35px 30px;
        width: 90%;
        max-width: 400px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
      }

      h1 {
        font-size: 1.5rem;
        font-weight: 600;
        margin-bottom: 24px;
        color: #1a1a1a;
      }

      label {
        display: block;
        font-size: 0.85rem;
        color: #555;
        margin-bottom: 5px;
      }

      input {
        width: 100%;
        border: none;
        border-bottom: 2px solid #000;
        font-size: 1rem;
        padding: 8px 5px;
        outline: none;
        margin-bottom: 20px;
        background: transparent;
        font-family: "Segoe UI", Tahoma, sans-serif;
        transition: border-color 0.2s;
      }

      input:focus {
        border-bottom-color: #d1b48c;
      }

      input.err {
        border-bottom-color: #e53e3e;
        margin-bottom: 4px;
      }

      .err-msg {
        font-size: 0.78rem;
        color: #e53e3e;
        margin-bottom: 14px;
        display: none;
      }

      .fila {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 5px;
      }

      .fila label {
        margin-bottom: 0;
      }

      a {
        font-size: 0.8rem;
        color: #888;
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      .botones {
        display: flex;
        justify-content: flex-end;
        margin-top: 8px;
      }

      button {
        padding: 12px 28px;
        border: none;
        border-radius: 14px;
        background-color: #d1b48c;
        color: white;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        font-family: "Segoe UI", Tahoma, sans-serif;
        transition:
          background-color 0.2s,
          transform 0.2s;
      }

      button:hover {
        background-color: #c4a07a;
        transform: scale(1.03);
      }

      .footer {
        text-align: center;
        font-size: 0.82rem;
        color: #888;
        margin-top: 20px;
      }

      .footer a {
        color: #d1b48c;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Iniciar sesión</h1>

      <label for="email">Correo electrónico</label>
      <input
        type="email"
        id="email"
        placeholder="tu@correo.com"
        autocomplete="email"
      />
      <p class="err-msg" id="errorEmail">Ingresa un correo válido.</p>

      <div class="fila">
        <label for="password">Contraseña</label>
        <a href="#">¿Olvidaste tu contraseña?</a>
      </div>
      <input
        type="password"
        id="password"
        placeholder="••••••••"
        autocomplete="current-password"
      />
      <p class="err-msg" id="errorPassword">Mínimo 6 caracteres.</p>

      <div class="botones">
        <button id="botonEntrar">Entrar</button>
      </div>

      <p class="footer">
        ¿No tienes cuenta? <a href="./register.html">Regístrate</a>
      </p>
    </div>

    <script>
      let inputEmail = document.getElementById("email");
      let inputPassword = document.getElementById("password");
      let errorEmail = document.getElementById("errorEmail");
      let errorPassword = document.getElementById("errorPassword");
      let botonEntrar = document.getElementById("botonEntrar");

      inputEmail.addEventListener("input", () => {
        inputEmail.classList.remove("err");
        errorEmail.style.display = "none";
      });

      inputPassword.addEventListener("input", () => {
        inputPassword.classList.remove("err");
        errorPassword.style.display = "none";
      });

      botonEntrar.addEventListener("click", () => {
        let email = inputEmail.value.trim();
        let password = inputPassword.value;
        let valido = true;

        if (!email.includes("@") || !email.includes(".")) {
          inputEmail.classList.add("err");
          errorEmail.style.display = "block";
          valido = false;
        }

        if (password.length < 6) {
          inputPassword.classList.add("err");
          errorPassword.style.display = "block";
          valido = false;
        }

        if (valido) {
          fetch("login.php", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: email, password: password }),
          })
            .then((res) => res.json())
            .then((data) => {
              if (data.ok) {
                window.location.href = "notas.php";
              } else {
                errorPassword.textContent = "Correo o contraseña incorrectos.";
                errorPassword.style.display = "block";
              }
            });
        }
      });
    </script>
  </body>
</html>
